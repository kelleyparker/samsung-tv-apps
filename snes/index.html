<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0">
    <title>SNES</title>
    <style>
        html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        /* Locked to 1920x1080 max; scaled up by the TV if its panel is larger */
        /* Locked to 1920x1080 max. (Tested 960x540 scaled 2x: no smoother, so resolution is not the bottleneck.) */
        #game { width: 100vw; height: 100vh; max-width: 1920px; max-height: 1080px; margin: 0 auto; }
    </style>
</head>
<body>
    <div id="game"></div>
    <script src="js/run.js"></script>
    <script src="js/debug.js"></script>
    <script>
        EJS_player = '#game';
        EJS_core = window.RUN_CORE || 'snes9x';
        EJS_pathtodata = 'data/';
        EJS_gameUrl = 'roms/smw.zip';
        EJS_gameName = 'Super Mario World';
        EJS_startOnLoaded = true;
        EJS_threads = (window.RUN_THREADS !== false);
        EJS_defaultOptions = window.RUN_OPTS || {};
        EJS_disableLocalStorage = true;
        if (window.RUN_HIDE_UI) {
            EJS_Buttons = { playPause: false, restart: false, mute: false, settings: false, fullscreen: false,
                saveState: false, loadState: false, screenRecord: false, gamepad: false, cheat: false, volume: false,
                saveSavFiles: false, loadSavFiles: false, quickSave: false, quickLoad: false, screenshot: false,
                cacheManager: false, exitEmulation: false };
        }   // so each build's settings apply, not ones saved by an older run
        EJS_color = '#7fb0ff';
        EJS_backgroundColor = '#000000';
        EJS_disableDatabases = true;
    </script>
    <script src="js/tune.js"></script>
    <script>
        // RUN_NOEMU (control runs only): skip the emulator to measure the TV's own frame pacing
        if (!window.RUN_NOEMU) { document.write('<script src="data/loader.js"><\/script>'); }
    </script>
    <script src="js/main.js"></script>
</body>
</html>
